[project]
name = "homelab-icon-generator"
version = "0.1.0"
description = "Procedural SVG/PNG icon generator for homelab services"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.1.0",
    "flask>=3.0.0",
    "resvg-py==0.3.3",
    "defusedxml>=0.7.1,<0.8",
]

[project.scripts]
homelab-icons = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
